<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question: multiple choice</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lq.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="lq" data-theme="{{theme}}" data-brand="{{brand}}" style="width: {{w}}px; height: {{h}}px; font-family: var(--font-sans); color: var(--ink);">

  <header class="topbar">
    <a class="icon-btn" href="Today.dc.html" aria-label="End session">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;">
      <div class="bar" role="progressbar" aria-label="Session progress" aria-valuenow="7" aria-valuemin="0" aria-valuemax="20" aria-valuetext="7 of 20" style="flex: 1;">
        <div class="bar-fill" style="width: 35%;"></div>
      </div>
      <span class="t-overline num muted">7 of 20</span>
    </div>
    <button class="icon-btn" type="button" aria-label="Read aloud" aria-pressed="{{listenPressed}}" onClick="{{toggleListen}}">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
    </button>
  </header>

  <main class="scroll" style="padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 24px;">
    <h1 id="qc-stem" class="t-title2">A pallet’s shrink wrap is torn on arrival. What do you do first?</h1>
    <div class="opt-list" role="radiogroup" aria-labelledby="qc-stem">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <button class="opt" type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}">
          <span class="radio" aria-hidden="true"></span>
          <span class="opt-text">{{o.text}}</span>
        </button>
      </sc-for>
    </div>
  </main>

  <sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
    <div style="flex: none; padding: 0 16px 12px;">
      <div class="sunken" role="alert" style="display: flex; align-items: flex-start; gap: 12px;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
        <p class="t-body">Couldn’t check your answer. It’s saved on this phone.</p>
      </div>
    </div>
  </sc-if>

  <div class="dock">
    <fieldset>
      <legend id="qc-conf-legend" class="conf-legend" style="padding: 0;">How sure are you?</legend>
      <div class="conf" role="radiogroup" aria-labelledby="qc-conf-legend">
        <sc-for list="{{confs}}" as="c" hint-placeholder-count="3">
          <button class="conf-btn" type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}">
            <span class="conf-tick" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"></path></svg></span>
            {{c.label}}
          </button>
        </sc-for>
      </div>
    </fieldset>

    <sc-if value="{{showCheck}}" hint-placeholder-val="{{ false }}">
      <a class="btn btn-primary btn-lg btn-block" href="{{href}}">Check</a>
    </sc-if>
    <sc-if value="{{showDisabled}}" hint-placeholder-val="{{ true }}">
      <button class="btn btn-lg btn-block" type="button" disabled>Check</button>
    </sc-if>
    <sc-if value="{{showRetry}}" hint-placeholder-val="{{ false }}">
      <button class="btn btn-primary btn-lg btn-block" type="button" onClick="{{retry}}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>
        Try again
      </button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"brand":{"editor":"enum","options":["default","plum"],"default":"default","section":"Theme"},"error":{"editor":"boolean","default":false,"section":"Variant"},"w":{"editor":"int","default":360,"section":"Frame"},"h":{"editor":"int","default":740,"section":"Frame"},"$preview":{"width":360,"height":740}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: null, conf: null, listen: false, retried: false };
  }
  renderVals() {
    const errProp = this.props.error === true || this.props.error === 'true';
    const errActive = errProp && !this.state.retried;
    const sel = this.state.sel ?? (errProp ? 'C' : null);
    const conf = this.state.conf ?? (errProp ? 'sure' : null);
    const texts = {
      A: 'Re-wrap it and put it away as normal',
      B: 'Photograph the damage and note it on the delivery receipt',
      C: 'Move it straight to Quarantine bay Q1',
      D: 'Sign the receipt, then tell your lead'
    };
    const options = ['A', 'B', 'C', 'D'].map((k) => ({
      text: texts[k],
      checked: sel === k ? 'true' : 'false',
      pick: () => this.setState({ sel: k, conf, retried: true })
    }));
    const labels = { sure: 'Sure', unsure: 'Unsure', guessing: 'Guessing' };
    const confs = ['sure', 'unsure', 'guessing'].map((k) => ({
      label: labels[k],
      checked: conf === k ? 'true' : 'false',
      pick: () => this.setState({ conf: k, sel, retried: true })
    }));
    const ready = sel !== null && conf !== null;
    let href = 'RevealNotQuite.dc.html';
    if (sel === 'B') href = conf === 'sure' ? 'Reveal.dc.html' : 'RevealUnsure.dc.html';
    else if (conf === 'sure') href = 'RevealSureWrong.dc.html';
    return {
      theme: this.props.theme ?? 'light',
      brand: this.props.brand ?? 'default',
      w: this.props.w ?? 360,
      h: this.props.h ?? 740,
      listenPressed: this.state.listen ? 'true' : 'false',
      toggleListen: () => this.setState({ listen: !this.state.listen }),
      options,
      confs,
      href,
      showError: errActive,
      showRetry: errActive,
      showCheck: ready && !errActive,
      showDisabled: !ready && !errActive,
      retry: () => this.setState({ retried: true, sel, conf })
    };
  }
}
</script>
</body>
</html>
