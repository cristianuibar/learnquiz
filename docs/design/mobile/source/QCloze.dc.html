<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question: fill the blank</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lq.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="lq" data-theme="{{theme}}" data-brand="{{brand}}" style="width: {{w}}px; height: {{h}}px; font-family: var(--font-sans); color: var(--ink);">

  <header class="topbar">
    <a class="icon-btn" href="Today.dc.html" aria-label="End session">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;">
      <div class="bar" role="progressbar" aria-label="Session progress" aria-valuenow="9" aria-valuemin="0" aria-valuemax="20" aria-valuetext="9 of 20" style="flex: 1;">
        <div class="bar-fill" style="width: 45%;"></div>
      </div>
      <span class="t-overline num muted">9 of 20</span>
    </div>
    <button class="icon-btn" type="button" aria-label="Read aloud" aria-pressed="{{listenPressed}}" onClick="{{toggleListen}}">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
    </button>
  </header>

  <main class="scroll" style="padding: 8px 16px 16px;">
    <label for="cz-blank" class="t-title2" style="display: block; line-height: 40px; padding: 4px 0;">Never lift more than <input id="cz-blank" class="input is-focus num" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus aria-label="Missing number" value="{{val}}" onChange="{{onVal}}" style="display: inline-block; vertical-align: middle; width: 88px; min-height: 0; height: 36px; margin: -4px 4px 0; padding: 4px 8px; font-size: 20px; line-height: 24px; font-weight: 600; text-align: center; border-color: var(--brand);"> kg on your own. Above that, use a two-person lift.</label>
  </main>

  <div class="dock" style="padding-top: 8px; padding-bottom: 8px; gap: 8px;">
    <fieldset>
      <legend id="cz-conf-legend" class="conf-legend" style="padding: 0; margin-bottom: 4px;">How sure are you?</legend>
      <div class="conf" role="radiogroup" aria-labelledby="cz-conf-legend">
        <sc-for list="{{confs}}" as="c" hint-placeholder-count="3">
          <button class="conf-btn" type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}">
            <span class="conf-tick" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"></path></svg></span>
            {{c.label}}
          </button>
        </sc-for>
      </div>
    </fieldset>

    <sc-if value="{{showCheck}}" hint-placeholder-val="{{ false }}">
      <a class="btn btn-primary btn-lg btn-block" href="QVoice.dc.html">Check</a>
    </sc-if>
    <sc-if value="{{showDisabled}}" hint-placeholder-val="{{ true }}">
      <button class="btn btn-lg btn-block" type="button" disabled>Check</button>
    </sc-if>
  </div>

  <div class="kbd-area" aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, 48px) 24px; gap: 6px; padding: 6px 8px;">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <span class="k t-title2" style="display: flex; align-items: center; justify-content: center; color: var(--ink);">
        {{k.label}}
        <sc-if value="{{k.back}}" hint-placeholder-val="{{ false }}">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9l-5 6 5 6h11z"></path><path d="M12 9.5l4 4M16 9.5l-4 4"></path></svg>
        </sc-if>
      </span>
    </sc-for>
    <span class="t-caption muted" style="grid-column: 1 / -1; display: flex; align-items: center; justify-content: center;">System keyboard</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"brand":{"editor":"enum","options":["default","plum"],"default":"default","section":"Theme"},"w":{"editor":"int","default":360,"section":"Frame"},"h":{"editor":"int","default":740,"section":"Frame"},"$preview":{"width":360,"height":740}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { val: '', conf: null, listen: false };
  }
  renderVals() {
    const conf = this.state.conf;
    const labels = { sure: 'Sure', unsure: 'Unsure', guessing: 'Guessing' };
    const confs = ['sure', 'unsure', 'guessing'].map((k) => ({
      label: labels[k],
      checked: conf === k ? 'true' : 'false',
      pick: () => this.setState({ conf: k })
    }));
    const keys = [];
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0'].forEach((d) => keys.push({ label: d, back: false }));
    keys.push({ label: '', back: true });
    const ready = this.state.val.length > 0 && conf !== null;
    return {
      theme: this.props.theme ?? 'light',
      brand: this.props.brand ?? 'default',
      w: this.props.w ?? 360,
      h: this.props.h ?? 740,
      listenPressed: this.state.listen ? 'true' : 'false',
      toggleListen: () => this.setState({ listen: !this.state.listen }),
      val: this.state.val,
      onVal: (e) => this.setState({ val: String(e.target.value).replace(/[^0-9]/g, '').slice(0, 3) }),
      confs,
      keys,
      showCheck: ready,
      showDisabled: !ready
    };
  }
}
</script>
</body>
</html>
