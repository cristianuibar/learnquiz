<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00785f">
<title>Offline - Learn Quiz</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 24px; box-sizing: border-box; font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; color: #141822; background: #fff; }
  main { max-width: 36rem; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.2; }
  button { height: 48px; padding: 0 24px; border: 0; border-radius: 6px; font: inherit; font-weight: 500; color: #fff; background: #00785f; cursor: pointer; }
  button:focus-visible { outline: 3px solid #00785f; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
